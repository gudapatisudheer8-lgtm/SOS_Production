openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Read-only SOS database readiness check
      responses:
        "503":
          description: Foundation setup or database connectivity is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
components:
  schemas:
    ReadinessStatus:
      type: object
      required: [status, databaseReachable, targetVerified, reason]
      properties:
        status: { type: string }
        databaseReachable: { type: boolean }
        targetVerified: { type: boolean }
        reason: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

