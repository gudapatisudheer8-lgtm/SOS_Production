# Included inside the existing SOS HTTPS server, in addition to the original web/API routing.
location = /mobile { return 308 /mobile/; }
location = /mobile/release.json {
    root /opt/syndicateos/mobile-current;
    add_header Cache-Control "no-store" always;
}
# Expo's pnpm exports intentionally contain .pnpm in published asset paths.
# Only these trusted public export directories are exempt from dot-path protection.
location ^~ /mobile/assets/ {
    root /opt/syndicateos/mobile-current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /mobile/_expo/ {
    root /opt/syndicateos/mobile-current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /mobile/ {
    root /opt/syndicateos/mobile-current;
    if ($uri ~ "(?:^|/)\.") { return 403; }
    try_files $uri $uri/ /mobile/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
