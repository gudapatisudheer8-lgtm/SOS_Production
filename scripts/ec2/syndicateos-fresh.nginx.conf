# Include INSIDE the existing HTTPS server for sos.krishisetu9.in.
# Replace its previous root/index/location blocks; do not duplicate them.
# Preserve listen, server_name, certificate, renewal, and HTTP redirect settings.
root /opt/syndicateos/current/web;
index index.html;
client_max_body_size 11m;

location = /api {
    return 308 /api/;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    add_header Cache-Control "no-store" always;
}
location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /release.json {
    add_header Cache-Control "no-store" always;
}
location ~ ^/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ~ /\.(?!well-known(?:/|$)) {
    deny all;
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
